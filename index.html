<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YLE Starters 英語練習樂園</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--ink:#2b2d42;--soft:#6b6f80;--card:#fff;--pri:#ff7a59;--pri2:#ffb347;--blue:#4cc9f0;--green:#2ec4b6;--red:#ef476f;--yellow:#ffd166;--purple:#9b5de5;--line:#f0e3cc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Noto Sans TC",system-ui,sans-serif;font-size:18px;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#ff7a59,#ffb347);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
header h1{font-size:22px;margin:0;flex:1;cursor:pointer;font-weight:800;letter-spacing:.3px}
.pill{background:rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px;color:#fff}
button.pill{background:rgba(255,255,255,.25)}
main{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.zh{font-family:"Noto Sans TC",sans-serif}
.sub{color:var(--soft);font-size:15px}
.grid{display:grid;gap:14px}
.home{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.hcard{background:var(--card);border-radius:22px;padding:20px;text-align:left;box-shadow:0 5px 0 var(--line);border:3px solid var(--line);transition:transform .12s}
.hcard:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.hcard .ic{font-size:46px}
.hcard h3{margin:6px 0 2px;font-size:24px}
.hcard p{margin:0;color:var(--soft);font-size:15px;font-family:"Noto Sans TC"}
.welcome{background:#fff;border-radius:22px;padding:16px 18px;margin-bottom:16px;border:3px dashed #ffd9a8;display:flex;gap:14px;align-items:center}
.welcome .big{font-size:54px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.chip{background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-size:17px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.vcard{background:#fff;border-radius:18px;border:3px solid var(--line);padding:10px 6px;text-align:center;box-shadow:0 4px 0 var(--line)}
.vcard .e{font-size:54px;line-height:1.2;height:70px;display:flex;align-items:center;justify-content:center}
.vcard .w{font-size:22px;font-weight:800}
.vcard .z{font-size:14px;color:var(--soft);font-family:"Noto Sans TC"}
.bounce{animation:bn .4s}
@keyframes bn{30%{transform:scale(1.12)}60%{transform:scale(.95)}}
.sw{display:inline-block;width:52px;height:52px;border-radius:50%;border:3px solid rgba(0,0,0,.12)}
.num{font-size:46px;font-weight:800;color:var(--purple)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.primary{background:var(--pri);color:#fff;font-size:21px;font-weight:800;border-radius:16px;padding:12px 26px;box-shadow:0 5px 0 #d95c3e}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #d95c3e}
.ghost{background:#fff;color:var(--ink);font-size:17px;font-weight:700;border-radius:14px;padding:8px 16px;border:3px solid var(--line)}
.blue{background:var(--blue);color:#fff;box-shadow:0 5px 0 #2a9fc4}
.green{background:var(--green);box-shadow:0 5px 0 #1f9a8f}
.purple{background:var(--purple);box-shadow:0 5px 0 #7440b8}
.pmenu{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pbtn{background:#fff;border-radius:18px;border:3px solid var(--line);padding:14px 16px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;gap:12px;align-items:center}
.pbtn .ic{font-size:36px}
.pbtn b{font-size:19px;display:block}
.pbtn span{font-size:14px;color:var(--soft);font-family:"Noto Sans TC"}
.qbox{background:#fff;border-radius:24px;border:3px solid var(--line);padding:18px;box-shadow:0 5px 0 var(--line)}
.part{background:var(--purple);color:#fff;border-radius:14px;padding:8px 14px;font-weight:700;margin-bottom:12px;font-size:17px}
.part small{display:block;font-family:"Noto Sans TC";font-weight:400;opacity:.9;font-size:14px}
.prog{height:12px;background:#ffe9c7;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:99px;transition:width .3s}
.qtext{font-size:24px;font-weight:700;margin:12px 0}
.audio{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.play{background:var(--blue);color:#fff;font-size:20px;font-weight:800;border-radius:16px;padding:10px 20px;box-shadow:0 4px 0 #2a9fc4}
.play.slow{background:#8ecae6;box-shadow:0 4px 0 #5fa8c8}
.mini{background:#e8f7fd;color:#1b6f8c;font-size:16px;border-radius:12px;padding:6px 10px;font-weight:700}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.opt{background:#fff;border:4px solid var(--line);border-radius:20px;min-width:120px;min-height:120px;font-size:60px;padding:8px 12px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.opt small{font-size:16px;font-weight:700}
.opt.sel,.yn button.sel,.tf button.sel{border-color:var(--blue);background:#e8f7fd}
.right{border-color:var(--green)!important;background:#dcfaf6!important}
.wrong{border-color:var(--red)!important;background:#ffe3ea!important}
.bigE{font-size:110px;text-align:center;line-height:1.1}
.sentence{font-size:28px;text-align:center;font-weight:700;margin:6px 0 10px}
.tf{display:flex;gap:18px;justify-content:center}
.tf button{font-size:44px;width:110px;height:90px;border-radius:20px;background:#fff;border:4px solid var(--line)}
.scene{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:linear-gradient(#d9f2ff,#e9ffe0);border-radius:20px;padding:16px;margin-bottom:12px;border:3px solid #cdebd0}
.scene span{font-size:48px;background:rgba(255,255,255,.6);border-radius:14px;padding:2px 8px}
.yn{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px dashed var(--line);flex-wrap:wrap}
.yn .s{flex:1;font-size:21px;font-weight:600;min-width:200px}
.yn button{font-size:18px;font-weight:800;border-radius:12px;padding:6px 16px;background:#fff;border:3px solid var(--line)}
.slots{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.slot{width:54px;height:62px;border-radius:12px;border:3px dashed #c9b28a;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;background:#fffdf7}
.slot.f{border-style:solid;border-color:var(--blue);background:#e8f7fd}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:54px;height:58px;border-radius:12px;background:var(--yellow);font-size:30px;font-weight:800;box-shadow:0 4px 0 #e0a92c;color:var(--ink)}
.tile:disabled{opacity:.25}
.story{font-size:22px;line-height:2.2;background:#fffdf5;border-radius:16px;padding:14px 16px;border:2px solid var(--line)}
.gap{display:inline-block;min-width:110px;border-bottom:3px solid var(--pri);padding:0 8px;margin:0 4px;font-weight:800;color:var(--pri);background:#fff3ee;border-radius:8px 8px 0 0;line-height:1.5;text-align:center;font-size:21px}
.gap.act{background:#ffd8c9;outline:3px solid var(--pri)}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.bank button{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 12px;font-size:19px;font-weight:700;display:flex;flex-direction:column;align-items:center;min-width:90px}
.bank button .e{font-size:34px}
.bank button.used{opacity:.4}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:12px 0}
.person{background:linear-gradient(#e6f6ff,#f1ffe9);border:4px solid #cde6d0;border-radius:18px;padding:8px;font-size:50px;text-align:center;position:relative;min-height:110px}
.person .tag{display:block;font-size:17px;font-weight:800;color:#fff;background:var(--purple);border-radius:10px;margin-top:4px;min-height:24px}
.person .tag:empty{background:transparent}
.names{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.name{background:#fff;border:3px solid var(--line);border-radius:14px;padding:6px 12px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px}
.name.sel{border-color:var(--purple);background:#f1e8ff}
.name.done{opacity:.55}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin:12px 0}
.obj{border-radius:50%;aspect-ratio:1;height:110px;border:5px dashed #cfc2aa;background:#fff;font-size:56px;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:background .2s}
.obj small{font-size:14px;font-weight:700;background:rgba(255,255,255,.8);border-radius:8px;padding:0 6px;margin-top:-4px}
.obj.painted{border-style:solid;border-color:rgba(0,0,0,.15)}
.palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff;border-radius:16px;padding:10px;border:3px solid var(--line)}
.crayon{border-radius:12px;padding:6px 10px;color:#fff;font-weight:800;font-size:16px;border:4px solid transparent;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.crayon.sel{border-color:var(--ink);transform:scale(1.08)}
.inst{display:flex;flex-direction:column;gap:6px;margin:10px 0}
input.ans{font-family:inherit;font-size:26px;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:6px 12px;width:200px;text-align:center;color:var(--purple)}
input.ans:focus{outline:none;border-color:var(--blue)}
.fb{min-height:10px;margin:12px 0;font-size:21px;font-weight:800;text-align:center}
.answerBox{background:#dcfaf6;border:3px solid var(--green);border-radius:16px;padding:10px 16px;margin:10px auto 0;max-width:520px;color:#14786e}.answerBox b{font-size:28px;color:#0f6a61}.ansRow{margin:2px 0}.ansQ{font-size:17px;color:var(--ink);font-weight:600}
.fb.ok{color:var(--green)}.fb.no{color:var(--red)}
.trans{background:#f5f0ff;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:17px;color:#4a3a70}
.trans b{font-family:"Noto Sans TC"}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap}
.result{text-align:center}
.result .score{font-size:72px;font-weight:800;color:var(--pri);line-height:1}
.result .face{font-size:90px}
.bars{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.bars div{background:#fff;border-radius:16px;border:3px solid var(--line);padding:10px 18px;font-weight:700}
table.rev{width:100%;border-collapse:collapse;margin-top:14px;background:#fff;border-radius:16px;overflow:hidden;font-size:16px}
table.rev td,table.rev th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rev th{background:#fff1dc;font-family:"Noto Sans TC"}
table.rev tr.x td{background:#fff5f7}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);font-size:54px;font-weight:800;color:#fff;background:var(--green);padding:14px 30px;border-radius:30px;opacity:0;pointer-events:none;transition:all .25s;z-index:20;box-shadow:0 8px 0 rgba(0,0,0,.12);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast.bad{background:var(--pri2)}
.hist{margin-top:14px;font-size:15px;color:var(--soft);font-family:"Noto Sans TC"}
.vbox{margin-top:16px;background:#fff;border-radius:16px;border:2px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.vsel{font-size:16px;padding:6px 8px;border-radius:10px;border:2px solid var(--line);max-width:100%;font-family:inherit}
.timer{margin:-4px 0 12px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:20px;text-align:center;font-family:"Baloo 2","Noto Sans TC"}
.timer.play{background:#e3f6fd;color:#16708f}.timer.wait{background:#fff4d6;color:#8a5a00}.timer.hurry{background:#ffe0e6;color:#c2184b}
.timed .audio,.timed .lp{display:none!important}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:14px}
.kid{background:#fff;border:4px solid var(--line);border-radius:22px;padding:16px 10px;text-align:center;cursor:pointer;position:relative;box-shadow:0 5px 0 var(--line)}
.kid.cur{border-color:var(--blue)}
.kav{font-size:64px;line-height:1.1}.kname{font-size:24px;font-weight:800}
.kdel{position:absolute;top:6px;right:6px;background:transparent;font-size:16px;border-radius:10px;padding:2px 6px;font-family:"Noto Sans TC"}
.kdel.arm{background:var(--red);color:#fff;font-weight:700}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.avb{font-size:34px;background:#fff;border:3px solid var(--line);border-radius:14px;width:58px;height:58px}
.avb.on{border-color:var(--pri);background:#fff1ea}
.rb{display:inline-block;font-size:13px;font-weight:700;font-family:"Noto Sans TC";background:#dcfaf6;color:#14786e;border-radius:10px;padding:2px 8px;margin-top:4px}
.rb.full{background:#fff1c7;color:#9a6b00}.rb.new{background:#f1f1f1;color:#999}
.rbrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px}
.rbline{font-size:20px;font-weight:800;color:var(--purple);margin:8px 0}
.prog2{margin-top:8px}.prog2 .prog{margin:4px 0 2px;height:8px}
.hwgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hwc{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--line)}
.hwc.done{border-color:#bfeee8;background:#f4fffd}
.hwe{font-size:44px;height:56px;display:flex;align-items:center;justify-content:center}
.hww{font-size:22px;font-weight:800;margin:2px 0;transition:filter .2s}
.hww.blur{filter:blur(6px);user-select:none}
.dots{font-size:20px;letter-spacing:3px;color:#d0c4ad}.dot.on{color:var(--green)}
.rb.due{background:#ffe0e6;color:#c2184b}
.note{background:#fff;border-radius:16px;padding:12px 16px;border:2px solid var(--line);font-family:"Noto Sans TC";font-size:15px;color:var(--soft);margin-top:18px;line-height:1.7}
h2{margin:4px 0 6px;font-size:28px}
.opts>*,.tf>*,.chips>*,.toolbar>*,.audio>*,.names>*,.bank>*,.tiles>*,.slots>*,.palette>*,.avs>*,.scene>*,.foot>*,.bars>*,.yn>*{margin:3px}
.hs{display:none}.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
header{flex-wrap:wrap}

  body{font-size:16px}
  header{padding:8px 10px;gap:6px}

  .qbox{padding:12px;border-radius:18px}
  .part{font-size:14px;padding:7px 10px}.part small{font-size:12px}
  .primary{font-size:18px;padding:10px 18px}
  .play{font-size:17px;padding:8px 14px}

  .fb{font-size:18px}

  .vbox{font-size:14px}.vsel{font-size:14px;width:100%}
  .note{font-size:13px}
  .toast{font-size:36px;padding:10px 22px}
}
@media (max-width:380px){.home{grid-template-columns:1fr}.people,.objs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.obj{height:90px}.opt{min-width:92px;min-height:92px;font-size:46px}.bigE{font-size:90px}.sentence{font-size:24px}.qtext{font-size:21px}.person{font-size:40px}.obj{font-size:44px}header h1{font-size:18px}}
img.emoji{height:1em;width:1em;margin:0 .05em 0 .1em;vertical-align:-0.1em}
</style>

<main id="app"></main>
